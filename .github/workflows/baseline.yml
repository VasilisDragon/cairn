name: Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-baseline:
    name: Windows offline baseline
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/mcbot-gradle-user-home

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare npm dependency cache
        shell: pwsh
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          GITHUB_TOKEN: ''
        run: |
          $npmStage = Join-Path $env:RUNNER_TEMP 'mcbot-npm-cache-warm'
          New-Item -ItemType Directory -Force -Path $npmStage | Out-Null
          Copy-Item -LiteralPath package.json, package-lock.json -Destination $npmStage
          Push-Location $npmStage
          try {
            npm ci --ignore-scripts --no-audit --no-fund
          } finally {
            Pop-Location
          }

      - name: Prepare Fabric dependency cache
        working-directory: fabric-client
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          GITHUB_TOKEN: ''
        run: .\gradlew.bat --dependency-verification=strict --no-daemon --max-workers=1 --console=plain testClasses

      - name: Prepare Paper dependency cache
        working-directory: test-harness-plugin
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          GITHUB_TOKEN: ''
        run: .\gradlew.bat --dependency-verification=strict --no-daemon --max-workers=1 --console=plain testClasses

      - name: Run guarded offline baseline
        shell: pwsh
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          GITHUB_TOKEN: ''
        run: |
          @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN') | ForEach-Object {
            [Environment]::SetEnvironmentVariable($_, $null, 'Process')
          }
          $ruleName = "MCBot-Baseline-No-Egress-$PID"
          $canary = Join-Path $env:RUNNER_TEMP 'NetworkCanary.java'
          @'
          import java.net.InetSocketAddress;
          import java.net.Socket;
          public class NetworkCanary {
              public static void main(String[] args) throws Exception {
                  try (Socket socket = new Socket()) {
                      socket.connect(new InetSocketAddress("1.1.1.1", 443), 3000);
                      System.exit(3);
                  } catch (java.io.IOException expected) {
                      System.exit(0);
                  }
              }
          }
          '@ | Set-Content -LiteralPath $canary -Encoding utf8
          New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -RemoteAddress Any | Out-Null
          try {
            & java $canary
            if ($LASTEXITCODE -ne 0) {
              throw 'JVM network canary reached an external address during the guarded phase'
            }
            npm run test:baseline -- --output-root "$env:RUNNER_TEMP\mcbot-baseline"
            $baselineExit = $LASTEXITCODE
          } finally {
            Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue
          }
          if ($baselineExit -ne 0) { exit $baselineExit }

      - name: Restore runner egress
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -Name 'MCBot-Baseline-No-Egress-*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline
          path: ${{ runner.temp }}/mcbot-baseline
          if-no-files-found: error
